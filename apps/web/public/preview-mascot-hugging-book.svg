<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Background Circle Radial Aura -->
    <radialGradient id="hugBgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b1d6e"/>
      <stop offset="70%" stop-color="#1f0a38"/>
      <stop offset="100%" stop-color="#0d0417"/>
    </radialGradient>

    <!-- Hair Lavender Gradient -->
    <linearGradient id="hairHug" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="45%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>

    <!-- Leather Grimoire Cover Gradient -->
    <linearGradient id="grimoireLeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="50%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#1e0538"/>
    </linearGradient>

    <!-- Gold Clasps & Filigree -->
    <linearGradient id="goldFiligree" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>

    <!-- Page Stack Edge Gradient -->
    <linearGradient id="bookEdgeStack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <filter id="softGlowHug" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Circular Outer Badge Background -->
  <circle cx="60" cy="60" r="56" fill="url(#hugBgGrad)" stroke="#6b21a8" stroke-width="2"/>
  <circle cx="60" cy="60" r="53" stroke="#c084fc" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.4"/>

  <!-- === 1. CHARACTER: HAIR & HEAD (TOP) === -->
  <!-- Back Hair Flowing Out Behind Shoulders -->
  <path d="M 32 45 C 24 55, 25 72, 33 80 C 35 70, 37 60, 36 50 Z" fill="url(#hairHug)" stroke="#1a0b2e" stroke-width="1.8"/>
  <path d="M 88 45 C 96 55, 95 72, 87 80 C 85 70, 83 60, 84 50 Z" fill="url(#hairHug)" stroke="#1a0b2e" stroke-width="1.8"/>

  <!-- Hair Ribbon / Bow on Right Side -->
  <g>
    <path d="M 86 28 C 92 24, 95 30, 88 34 C 95 37, 91 42, 85 36 Z" fill="#d946ef" stroke="#1a0b2e" stroke-width="1.4"/>
    <circle cx="86" cy="33" r="2.2" fill="#fde047" stroke="#1a0b2e" stroke-width="1"/>
  </g>

  <!-- Cute Round Anime Head -->
  <ellipse cx="60" cy="40" rx="22" ry="19" fill="#fff2eb" stroke="#1a0b2e" stroke-width="2"/>

  <!-- Rosy Cute Blush -->
  <ellipse cx="48" cy="46" rx="3.5" ry="1.8" fill="#f472b6" opacity="0.65"/>
  <ellipse cx="72" cy="46" rx="3.5" ry="1.8" fill="#f472b6" opacity="0.65"/>

  <!-- Smiling Anime Eyes (Happy Curved Arches ^^) -->
  <path d="M 46 39 Q 51 34 55 39" fill="none" stroke="#1a0b2e" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M 65 39 Q 69 34 74 39" fill="none" stroke="#1a0b2e" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Cute Happy Open Mouth -->
  <path d="M 57 46 Q 60 51 63 46 Z" fill="#e11d48" stroke="#1a0b2e" stroke-width="1.2"/>
  <path d="M 58 46 Q 60 48 62 46" fill="#ffffff"/>

  <!-- Anime Front Bangs -->
  <path d="M 38 35 C 43 25, 77 25, 82 35 C 80 43, 76 43, 73 37 C 69 44, 64 44, 61 37 C 57 44, 52 44, 49 37 C 45 43, 41 43, 38 35 Z" 
        fill="url(#hairHug)" stroke="#1a0b2e" stroke-width="2"/>

  <!-- Hair Shine Arc -->
  <path d="M 45 30 Q 60 27 75 30" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.65" fill="none"/>

  <!-- === 2. THE LARGE GRIMOIRE BOOK IN HER ARMS === -->
  <!-- Book Outer Shadow -->
  <rect x="33" y="52" width="54" height="48" rx="5" fill="#0c0417" opacity="0.4" transform="rotate(-4 60 76)"/>

  <!-- Book Leather Body -->
  <g transform="rotate(-4 60 76)">
    <!-- Thick Page Edge Stack on Right -->
    <path d="M 80 54 L 85 55 L 85 96 L 80 95 Z" fill="url(#bookEdgeStack)" stroke="#1a0b2e" stroke-width="1.5"/>
    <line x1="82" y1="56" x2="82" y2="95" stroke="#92400e" stroke-width="0.75"/>

    <!-- Front Leather Cover -->
    <rect x="32" y="52" width="49" height="44" rx="4" fill="url(#grimoireLeather)" stroke="#1a0b2e" stroke-width="2"/>

    <!-- Gilded Corner Clasps -->
    <path d="M 32 52 L 40 52 L 32 60 Z" fill="url(#goldFiligree)"/>
    <path d="M 81 52 L 73 52 L 81 60 Z" fill="url(#goldFiligree)"/>
    <path d="M 32 96 L 40 96 L 32 88 Z" fill="url(#goldFiligree)"/>
    <path d="M 81 96 L 73 96 L 81 88 Z" fill="url(#goldFiligree)"/>

    <!-- Gold Spine Clasp Strap -->
    <rect x="70" y="69" width="14" height="10" rx="3" fill="url(#goldFiligree)" stroke="#1a0b2e" stroke-width="1.2"/>
    <circle cx="79" cy="74" r="2" fill="#3b0764"/>

    <!-- Ornate Celestial Seal on Cover (Crescent Moon + Sunburst Star) -->
    <g filter="url(#softGlowHug)">
      <!-- Outer Rune Circle -->
      <circle cx="56" cy="74" r="11" fill="none" stroke="url(#goldFiligree)" stroke-width="1.4"/>
      <!-- Crescent Moon -->
      <path d="M 52 66 C 46 72, 46 80, 52 84 C 48 81, 48 71, 52 66 Z" fill="url(#goldFiligree)"/>
      <!-- Center Star Gem -->
      <path d="M 58 68 L 59 72 L 63 73 L 59 75 L 58 79 L 56 75 L 52 73 L 56 72 Z" fill="#fef08a"/>
      <circle cx="57.5" cy="73.5" r="2.5" fill="#c084fc"/>
    </g>

    <!-- Silk Bookmark Hanging Out Below Book -->
    <path d="M 45 96 L 45 106 L 49 103 L 53 106 L 53 96 Z" fill="#ec4899" stroke="#1a0b2e" stroke-width="1"/>
  </g>

  <!-- === 3. CHARACTER: CUTE ARMS & HANDS HUGGING THE BOOK === -->
  <!-- Left Sleeve & Hand (Hugging book from left) -->
  <g>
    <!-- Sleeve -->
    <path d="M 28 66 Q 34 76 40 82" fill="none" stroke="#fffbeb" stroke-width="7" stroke-linecap="round"/>
    <path d="M 28 66 Q 34 76 40 82" fill="none" stroke="#1a0b2e" stroke-width="2" stroke-linecap="round"/>
    <!-- Cute Little Hand gripping edge of book -->
    <ellipse cx="40" cy="82" rx="4" ry="3" fill="#fff2eb" stroke="#1a0b2e" stroke-width="1.4"/>
    <path d="M 38 82 L 42 82" stroke="#ebd1c5" stroke-width="0.75"/>
  </g>

  <!-- Right Sleeve & Hand (Hugging book from right) -->
  <g>
    <!-- Sleeve -->
    <path d="M 88 68 Q 80 78 72 84" fill="none" stroke="#fffbeb" stroke-width="7" stroke-linecap="round"/>
    <path d="M 88 68 Q 80 78 72 84" fill="none" stroke="#1a0b2e" stroke-width="2" stroke-linecap="round"/>
    <!-- Cute Little Hand gripping front of book -->
    <ellipse cx="71" cy="83" rx="4" ry="3" fill="#fff2eb" stroke="#1a0b2e" stroke-width="1.4"/>
    <path d="M 69 83 L 73 83" stroke="#ebd1c5" stroke-width="0.75"/>
  </g>

  <!-- Collar Ribbon at Neck -->
  <path d="M 54 51 C 57 53, 63 53, 66 51" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Magical Sparkles around her -->
  <g filter="url(#softGlowHug)">
    <path d="M 22 36 L 23 33 L 24 36 L 27 37 L 24 38 L 23 41 L 22 38 L 19 37 Z" fill="#fde047"/>
    <path d="M 98 48 L 99 45 L 100 48 L 103 49 L 100 50 L 99 53 L 98 50 L 95 49 Z" fill="#f5d0fe"/>
    <circle cx="28" cy="88" r="1.2" fill="#f0abfc"/>
    <circle cx="94" cy="78" r="1.4" fill="#fde047"/>
  </g>
</svg>
