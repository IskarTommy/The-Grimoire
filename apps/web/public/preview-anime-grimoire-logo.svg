<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Ambient Magic Halo -->
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#7c3aed" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#090514" stop-opacity="0"/>
    </radialGradient>

    <!-- Witch Hat Gradients -->
    <linearGradient id="hatCone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="45%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#17062e"/>
    </linearGradient>

    <linearGradient id="hatBrim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f0a3d"/>
      <stop offset="50%" stop-color="#3b1578"/>
      <stop offset="100%" stop-color="#1f0a3d"/>
    </linearGradient>

    <linearGradient id="hatBand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="60%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>

    <!-- Hair Lavender Gradient -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f3e8ff"/>
      <stop offset="40%" stop-color="#d8b4fe"/>
      <stop offset="85%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>

    <!-- Anime Sparkling Eye Gradient -->
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="40%" stop-color="#7c3aed"/>
      <stop offset="75%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f0abfc"/>
    </linearGradient>

    <!-- Book Leather Cover -->
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b1d6e"/>
      <stop offset="50%" stop-color="#1e0c38"/>
      <stop offset="100%" stop-color="#0c0317"/>
    </linearGradient>

    <!-- Page Parchment Gradients -->
    <linearGradient id="pageParchmentL" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffdf5"/>
      <stop offset="50%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#e2ba78"/>
    </linearGradient>

    <linearGradient id="pageParchmentR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffdf5"/>
      <stop offset="50%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#e2ba78"/>
    </linearGradient>

    <linearGradient id="pageStack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <!-- Gilded Gold Trim -->
    <linearGradient id="goldTrim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="60%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>

    <!-- Silk Bookmark Ribbon -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="60%" stop-color="#c026d3"/>
      <stop offset="100%" stop-color="#701a75"/>
    </linearGradient>

    <!-- Magic Glow Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="sparkleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- === 0. AMBIENT BACKING AURA === -->
  <circle cx="60" cy="55" r="50" fill="url(#auraGlow)"/>

  <!-- Magical Sparkle Stars Behind -->
  <g opacity="0.8" filter="url(#sparkleGlow)">
    <path d="M 24 28 L 26 23 L 28 28 L 33 30 L 28 32 L 26 37 L 24 32 L 19 30 Z" fill="#fde047" opacity="0.75"/>
    <path d="M 94 22 L 95.5 18 L 97 22 L 101 23.5 L 97 25 L 95.5 29 L 94 25 L 90 23.5 Z" fill="#f5d0fe" opacity="0.85"/>
    <circle cx="18" cy="46" r="1.2" fill="#e879f9"/>
    <circle cx="102" cy="42" r="1.5" fill="#fde047"/>
  </g>

  <!-- === 1. ANIME GIRL: BACK HAIR === -->
  <g>
    <!-- Left flowing back hair -->
    <path d="M 46 38 C 38 42, 32 54, 34 68 C 37 66, 42 62, 45 56 C 44 50, 45 42, 46 38 Z" fill="url(#hairGrad)"/>
    <!-- Right flowing back hair -->
    <path d="M 74 38 C 82 42, 88 54, 86 68 C 83 66, 78 62, 75 56 C 76 50, 75 42, 74 38 Z" fill="url(#hairGrad)"/>
  </g>

  <!-- === 2. ANIME GIRL: HEAD & SWEET EXPRESSION === -->
  <!-- Cute chibi face contour -->
  <path d="M 46 42 C 45 32, 75 32, 74 42 C 74 53, 68 59, 60 60 C 52 59, 46 53, 46 42 Z" 
        fill="#fff2eb" stroke="#ebd1c5" stroke-width="0.7"/>

  <!-- Rosy Cute Blush -->
  <ellipse cx="50" cy="50" rx="3.2" ry="1.6" fill="#f472b6" opacity="0.65"/>
  <ellipse cx="70" cy="50" rx="3.2" ry="1.6" fill="#f472b6" opacity="0.65"/>

  <!-- Left Anime Eye -->
  <g>
    <!-- Upper Eyelash -->
    <path d="M 48.5 44 C 50.5 41.5, 54.5 41.5, 56.5 44.5" fill="none" stroke="#1e1136" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 56 43 L 57.5 42" stroke="#1e1136" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Iris -->
    <ellipse cx="53" cy="46.8" rx="3.2" ry="4" fill="url(#eyeGrad)"/>
    <ellipse cx="53" cy="48" rx="2.2" ry="2.6" fill="#1e0c38"/>
    <!-- Eye Sparkle Highlights -->
    <circle cx="51.8" cy="45" r="1.3" fill="#ffffff"/>
    <circle cx="54.5" cy="48.2" r="0.7" fill="#ffffff"/>
    <path d="M 52 49 Q 53 50 54 49" stroke="#f5d0fe" stroke-width="0.6" fill="none"/>
  </g>

  <!-- Right Anime Eye -->
  <g>
    <!-- Upper Eyelash -->
    <path d="M 63.5 44.5 C 65.5 41.5, 69.5 41.5, 71.5 44" fill="none" stroke="#1e1136" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 64 43 L 62.5 42" stroke="#1e1136" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Iris -->
    <ellipse cx="67" cy="46.8" rx="3.2" ry="4" fill="url(#eyeGrad)"/>
    <ellipse cx="67" cy="48" rx="2.2" ry="2.6" fill="#1e0c38"/>
    <!-- Eye Sparkle Highlights -->
    <circle cx="65.8" cy="45" r="1.3" fill="#ffffff"/>
    <circle cx="68.5" cy="48.2" r="0.7" fill="#ffffff"/>
    <path d="M 66 49 Q 67 50 68 49" stroke="#f5d0fe" stroke-width="0.6" fill="none"/>
  </g>

  <!-- Cute Gentle Smile -->
  <path d="M 58.5 53.5 Q 60 55.5 61.5 53.5" fill="none" stroke="#e11d48" stroke-width="1.1" stroke-linecap="round"/>

  <!-- === 3. ANIME GIRL: FRONT BANGS & SIDE LOCKS === -->
  <g>
    <!-- Left side lock -->
    <path d="M 46 36 C 44 44, 43 52, 47 56 C 45 52, 45 44, 47 38 Z" fill="url(#hairGrad)"/>
    <!-- Right side lock -->
    <path d="M 74 36 C 76 44, 77 52, 73 56 C 75 52, 75 44, 73 38 Z" fill="url(#hairGrad)"/>

    <!-- Layered bangs across forehead -->
    <!-- Center Bang -->
    <path d="M 57 32 Q 59 43 60 45 Q 61 42 63 32 Z" fill="url(#hairGrad)"/>
    <!-- Left Bang -->
    <path d="M 51 32 Q 53 42 54 44 Q 56 40 58 32 Z" fill="url(#hairGrad)"/>
    <!-- Right Bang -->
    <path d="M 62 32 Q 64 42 66 44 Q 68 39 70 32 Z" fill="url(#hairGrad)"/>
    <!-- Hair Shimmer Highlight -->
    <path d="M 48 35 Q 60 33 72 35" stroke="#ffffff" stroke-width="0.9" opacity="0.6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- === 4. WITCH HAT (CHARMING & MYSTICAL) === -->
  <g>
    <!-- Witch Hat Cone (Tilted playfully to the right with cute curve) -->
    <path d="M 45 31 C 47 20, 56 12, 71 10 C 69 16, 75 22, 77 31 Z" 
          fill="url(#hatCone)" stroke="#6b21a8" stroke-width="0.9"/>

    <!-- Cute Tip Fold of the Hat -->
    <path d="M 71 10 C 74 8, 80 12, 76 17 C 73 14, 72 12, 71 10 Z" fill="#3b1578"/>

    <!-- Gilded Hat Ribbon Band -->
    <path d="M 44.5 31 C 52 28, 68 28, 77.5 31 L 78 33 C 68 30, 52 30, 44 33 Z" fill="url(#hatBand)"/>

    <!-- Golden Star Badge on Hat Ribbon -->
    <path d="M 53 28.5 L 54 26.5 L 55 28.5 L 57 29.5 L 55 30.5 L 54 32.5 L 53 30.5 L 51 29.5 Z" 
          fill="#fef08a" stroke="#ca8a04" stroke-width="0.5" filter="url(#sparkleGlow)"/>

    <!-- Curved Hat Brim (framing her forehead) -->
    <ellipse cx="61" cy="32.5" rx="20" ry="4.8" 
             fill="url(#hatBrim)" stroke="#6b21a8" stroke-width="1.2" transform="rotate(-3 61 32.5)"/>
  </g>

  <!-- === 5. THE OPEN GRIMOIRE SPELLBOOK === -->
  <!-- Outer Leather Cover Backing -->
  <g>
    <!-- Left Leather Cover Wing -->
    <path d="M 60 98 C 45 98, 25 95, 11 89 C 9 88, 8 86, 8 84 L 9 52 C 9 50, 11 48, 13 48 C 26 44, 44 46, 60 52 Z" 
          fill="url(#bookCover)" stroke="#581c87" stroke-width="1.8"/>

    <!-- Right Leather Cover Wing -->
    <path d="M 60 98 C 75 98, 95 95, 109 89 C 111 88, 112 86, 112 84 L 111 52 C 111 50, 109 48, 107 48 C 94 44, 76 46, 60 52 Z" 
          fill="url(#bookCover)" stroke="#581c87" stroke-width="1.8"/>

    <!-- Spine Hinge Base -->
    <path d="M 52 98 C 55 101, 65 101, 68 98 L 67 52 C 64 50, 56 50, 53 52 Z" 
          fill="#130722" stroke="#7e22ce" stroke-width="1.5"/>

    <!-- Gilded Brass Corner Clasps -->
    <path d="M 9 52 L 20 49 L 16 59 L 9 58 Z" fill="url(#goldTrim)"/>
    <path d="M 111 52 L 100 49 L 104 59 L 111 58 Z" fill="url(#goldTrim)"/>
    <path d="M 9 82 L 19 85 L 14 78 L 9 80 Z" fill="url(#goldTrim)"/>
    <path d="M 111 82 L 101 85 L 106 78 L 111 80 Z" fill="url(#goldTrim)"/>
  </g>

  <!-- Layered Parchment Pages -->
  <g>
    <!-- Stacked Pages Rim (Thickness & Antique Depth) -->
    <path d="M 12 88 C 26 93, 44 94, 59 92 L 59 87 C 44 89, 26 88, 13 83 Z" fill="url(#pageStack)"/>
    <path d="M 108 88 C 94 93, 76 94, 61 92 L 61 87 C 76 89, 94 88, 107 83 Z" fill="url(#pageStack)"/>

    <!-- Page Ridge Rim Lines -->
    <path d="M 13 85 C 27 90, 44 91, 59 89" stroke="#b45309" stroke-width="0.8" fill="none"/>
    <path d="M 107 85 C 93 90, 76 91, 61 89" stroke="#b45309" stroke-width="0.8" fill="none"/>

    <!-- Left Open Parchment Page -->
    <path d="M 60 54 C 44 47, 26 47, 13 52 C 12 52.5, 12 53, 12 54 L 13 83 C 26 88, 44 89, 59 87 Z" 
          fill="url(#pageParchmentL)" stroke="#b45309" stroke-width="0.75"/>

    <!-- Right Open Parchment Page -->
    <path d="M 60 54 C 76 47, 94 47, 107 52 C 108 52.5, 108 53, 108 54 L 107 83 C 94 88, 76 89, 61 87 Z" 
          fill="url(#pageParchmentR)" stroke="#b45309" stroke-width="0.75"/>

    <!-- Spine Center Crease Shading -->
    <path d="M 57 53 C 58 66, 58 80, 57 88 L 60 87 L 63 88 C 62 80, 62 66, 63 53 Z" 
          fill="#78350f" opacity="0.35"/>

    <!-- Ancient Magic Script Lines on Pages -->
    <g opacity="0.32" stroke="#92400e" stroke-width="1.2" stroke-linecap="round">
      <line x1="22" y1="59" x2="44" y2="56"/>
      <line x1="20" y1="65" x2="45" y2="62"/>
      <line x1="21" y1="71" x2="42" y2="68"/>
      <line x1="24" y1="77" x2="46" y2="74"/>

      <line x1="76" y1="56" x2="98" y2="59"/>
      <line x1="75" y1="62" x2="100" y2="65"/>
      <line x1="78" y1="68" x2="99" y2="71"/>
      <line x1="74" y1="74" x2="96" y2="77"/>
    </g>
  </g>

  <!-- === 6. CUTE CHIBI HANDS HOLDING THE BOOK === -->
  <!-- Left Hand Clasping Left Page Top -->
  <g>
    <!-- Little sleeve cuff -->
    <path d="M 40 61 L 43 57 L 46 60 L 43 64 Z" fill="#2e1065"/>
    <ellipse cx="45" cy="61" rx="3.5" ry="2.5" fill="#fff2eb" stroke="#ebd1c5" stroke-width="0.6"/>
    <!-- Cute little finger notches -->
    <path d="M 43.5 61 L 46.5 61" stroke="#e2ba78" stroke-width="0.5"/>
  </g>

  <!-- Right Hand Clasping Right Page Top -->
  <g>
    <!-- Little sleeve cuff -->
    <path d="M 80 61 L 77 57 L 74 60 L 77 64 Z" fill="#2e1065"/>
    <ellipse cx="75" cy="61" rx="3.5" ry="2.5" fill="#fff2eb" stroke="#ebd1c5" stroke-width="0.6"/>
    <!-- Cute little finger notches -->
    <path d="M 73.5 61 L 76.5 61" stroke="#e2ba78" stroke-width="0.5"/>
  </g>

  <!-- === 7. SILK BOOKMARK RIBBON & ARCANE CREST === -->
  <!-- Silk Ribbon Hanging Downward -->
  <path d="M 58 54 C 58 68, 59 86, 57 106 L 60 103 L 63 106 C 61 86, 62 68, 62 54 Z" 
        fill="url(#ribbonGrad)" filter="url(#softGlow)"/>

  <!-- Ethereal Magic Glyphs Rising Around Her -->
  <g opacity="0.85" filter="url(#sparkleGlow)">
    <!-- Small star hovering over the open book center -->
    <path d="M 60 67 L 61 64 L 62 67 L 65 68 L 62 69 L 61 72 L 60 69 L 57 68 Z" fill="#fde047"/>
    <circle cx="51" cy="74" r="1" fill="#f0abfc"/>
    <circle cx="69" cy="74" r="1" fill="#f0abfc"/>
  </g>
</svg>
